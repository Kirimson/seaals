<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="/assets/output.css" rel="stylesheet" />
    <title>SEAaLS - Seals as a Service</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>

  <body
    class="bg-sky-200 dark:bg-cyan-900 text-gray-900 dark:text-gray-100 transition-colors duration-500 mb-5"
  >
    <nav
      class="bg-zinc-100 dark:bg-zinc-900 text-black dark:text-white sticky top-0"
    >
      <div class="flex h-14 items-center justify-between gap-8 px-4 sm:px-6">
        <a href="/">
          <div id="logo" class="flex items-center gap-2">
            <div class="align-middle text-2xl">🦭</div>
            <span>SEAaLS - Seals as a Service</span>
          </div>
        </a>
        <div id="links">
          <a
            class="opacity-50 hover:opacity-100 transition-opacity"
            alt="Github"
            href="https://github.com/kirimson/"
            ><i class="fa-brands fa-github fa-lg"></i
          ></a>
        </div>
      </div>
    </nav>

    <div class="wave bg-zinc-100 dark:bg-zinc-900 h-screen"></div>

    <content class="flex flex-col px-5">
      <section id="upper" class="max-w-7xl justify-between mx-auto pt-16">
        <h1 class="text-6xl tracking-tighter text-balance text-center">
          Get a seal for any situation
        </h1>

        <div class="flex justify-center flex-col items-center">
          <div class="py-8 text-xl tracking-tighter text-balance text-center">
            <p>A REST API to get seals of approval, or seals of any kind</p>
          </div>
        </div>
      </section>

      <section
        class="flex flex-col md:flex-row mx-5 md:mx-0 items-center justify-center content-between py-8 gap-16"
      >
        <section class="flex flex-col items-center">
          <div
            class="flex flex-col items-center text-xl tracking-tighter text-center text-balance pb-6"
          >
            <h2 class="text-4xl">Get a Random Seal Image</h2>
          </div>

          <a href="/seal">
            <button
              class="rounded-md py-2 px-4 border border-transparent transition-all shadow-md hover:shadow-lg text-center text-black dark:text-white focus:shadow-none bg-sky-500 dark:bg-sky-800 hover:bg-sky-300 hover:dark:bg-sky-700 hover:cursor-pointer"
              type="submit"
            >
              <b>Get a Seal!</b>
            </button>
          </a>
        </section>

        <section class="flex flex-col items-center">
          <div
            class="flex flex-col md:flex-row items-center text-4xl tracking-tighter text-balance pb-6"
          >
            <h2>Get a Seal Saying: &nbsp;</h2>
            <input
              id="says-input"
              class="w-[9ch] p-0 m-0 border-b-2 focus:outline-0"
              type="text"
              value="Something"
              onKeyUp="UpdateSays()"
            />
          </div>

          <a id="says-link" href="/seal/says/Something">
            <button
              class="rounded-md py-2 px-4 border border-transparent transition-all shadow-md hover:shadow-lg text-center text-black dark:text-white focus:shadow-none bg-sky-500 dark:bg-sky-800 hover:bg-sky-300 hover:dark:bg-sky-700 hover:cursor-pointer"
              type="submit"
            >
              <b id="says-text">Get a Seal!</b>
            </button>
          </a>
        </section>
      </section>

      <section class="flex flex-col items-center">
        <span class="text-xl text-center pb-6">Or View The Docs: </span>
        <a href="/swagger/index.html">
          <button
            class="rounded-md py-2 px-4 border border-transparent transition-all shadow-md hover:shadow-lg text-center text-black dark:text-white focus:shadow-none bg-sky-500 dark:bg-sky-800 hover:bg-sky-300 hover:dark:bg-sky-700 hover:cursor-pointer"
            type="submit"
          >
            <b>API Docs</b>
          </button>
        </a>
      </section>

      <section class="flex flex-row items-center">
        <div id="stats" class="flex flex-col items-center">
          <p class="text-lg">
            Currently, we have <span id="seal-count">0</span> seals
          </p>
          <p class="text-lg">The most popular tags are:</p>
          <div>
            <table
              class="rounded-corners bg-sky-500 dark:bg-sky-800 border-separate border-1 border-zinc-800 rounded-lg overflow-hidden border-spacing-0"
            >
              <thead>
                <tr
                  class="*:font-medium dark:*:text-slate-300 *:border-b-1 *:border-zinc-800"
                >
                  <th class="px-6 py-3">Tag</th>
                  <th class="px-6 py-3">Count</th>
                </tr>
              </thead>
              <tbody
                class="bg-zinc-100 dark:bg-zinc-900 **:px-6 **:py-3"
                id="popular-tags"
              ></tbody>
            </table>
          </div>
        </div>

        <div id="usage" class="grow border">
          <div>
            <table
              class="rounded-corners bg-sky-500 dark:bg-sky-800 border-separate border-1 border-zinc-800 rounded-lg overflow-hidden border-spacing-0"
            >
              <thead>
                <tr
                  class="*:font-medium dark:*:text-slate-300 *:border-b-1 *:border-zinc-800"
                >
                  <th class="px-6 py-3">Tag</th>
                  <th class="px-6 py-3">Count</th>
                </tr>
              </thead>
              <tbody
                class="bg-zinc-100 dark:bg-zinc-900 **:px-6 **:py-3"
              ></tbody>
            </table>
          </div>
        </div>
      </section>
    </content>
    <script src="/assets/js/index.js"></script>
  </body>
</html>
